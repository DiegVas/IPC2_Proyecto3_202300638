{% extends 'base.html' %} {% block content %}
<div class="card medium-card">
  <h2>Prueba de Mensaje</h2>

  <form method="post" class="analysis-form">
    {% csrf_token %}
    <div class="form-group">
      <label for="message" class="form-label">Mensaje XML</label>
      <textarea id="message" name="message" class="form-control" rows="6"></textarea>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Analizar</button>
    </div>
  </form>

  {% if result %}
  <div class="result-section">
    <h3>Resultado:</h3>
    <pre class="result-content">{{ result|pprint }}</pre>
  </div>
  {% endif %}
</div>
{% endblock %}
