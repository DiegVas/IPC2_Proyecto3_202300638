{% load static %}
<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tecnologías Chapinas, S.A</title>
    <link rel="stylesheet" href="{% static 'main.css' %}" />
    <!-- CSS de Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />

    <!-- JavaScript de Bootstrap (colocar antes del cierre de </body>) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- CSS de Flatpickr -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css" />

    <!-- JavaScript de Flatpickr -->
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  </head>
  <body>
    <header class="main-header">
      <div class="container">
        <div class="nav-wrapper">
          <a href="{% url 'home' %}" class="brand">
            <span class="brand-name">Tecnologías Chapinas, S.A</span>
          </a>

          <nav class="nav-links">
            <a href="{% url 'home' %}" class="nav-link">Inicio</a>
            <a href="#" class="nav-link">Cargar Archivo</a>

            <div class="dropdown">
              <a href="#" class="nav-link">Peticiones</a>
              <div class="dropdown-content">
                <a href="#">Consultar Datos</a>
                <a href="#">Resumen por Fecha</a>
                <a href="#">Resumen por Rango</a>
                <a href="#">Reporte PDF</a>
                <a href="#">Prueba de Mensaje</a>
              </div>
            </div>

            <div class="dropdown">
              <a href="#" class="nav-link">Ayuda</a>
              <div class="dropdown-content">
                <a href="#">Información del Estudiante</a>
                <a href="#">Documentación</a>
              </div>
            </div>
          </nav>
        </div>
      </div>
    </header>

    <main class="main-content" role="main">
      <div class="container">{% block content %}{% endblock %}</div>
    </main>
  </body>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      flatpickr("#dateRange", {
        mode: "range", // Habilita el modo de rango
        dateFormat: "Y-m-d", // Formato de fecha
      });
    });

    document.addEventListener("DOMContentLoaded", function () {
      flatpickr("#singleDate", {
        dateFormat: "Y-m-d", // Formato de fecha (puedes personalizarlo)
      });
    });
  </script>
</html>
